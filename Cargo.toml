[package]
name = "agentor"
version = "0.1.0"
edition = "2021"
description = "Local Git auto-deploy tool with post-commit hook - 本地 Git 自动部署工具"
license = "MIT"

[[bin]]
name = "agentor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.11"
log = "0.4"
anyhow = "1"
