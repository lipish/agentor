[package]
name = "agentor"
version = "0.3.0"
edition = "2021"
description = "Agent-native Actor runtime — an Actor-model execution platform designed for AI Agents"
license = "MIT"
repository = "https://github.com/lipish/agentor"
homepage = "https://github.com/lipish/agentor"
documentation = "https://github.com/lipish/agentor#readme"
keywords = ["agent", "actor", "ai", "runtime", "async"]
categories = ["asynchronous", "concurrency"]
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
dashmap = "6"
parking_lot = "0.12"
xtrace-client = { version = "0.0.12", features = ["tracing"] }
llm-connector = "0.6.0"
futures-util = "0.3"
mcp-client = "0.1.0"
mcp-core = "0.1.50"
url = "2.5.8"

[dev-dependencies]
tokio-test = "0.4"
